<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · CIAN</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #faf8f5;
        --foreground: #1f1b16;
        --muted-foreground: #5c5349;
        --border: #e3dcd1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #16130f;
          --foreground: #f5f1ea;
          --muted-foreground: #b5aa9b;
          --border: #332c24;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--background);
        color: var(--foreground);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 1.5rem 0 0.5rem;
      }
      p {
        color: var(--muted-foreground);
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        color: inherit;
        text-decoration: none;
        min-height: 2.75rem;
      }
      a:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CIAN">
        <rect width="64" height="64" rx="14" fill="#1b1f5a" />
        <path
          d="M44 20a17 17 0 1 0 0 24"
          fill="none"
          stroke="#c9a227"
          stroke-width="6"
          stroke-linecap="round"
        />
        <circle cx="32" cy="32" r="4" fill="#c9a227" />
      </svg>
      <h1>Sin conexión</h1>
      <p>
        No pudimos conectar con CIAN. Revisa tu conexión a internet y vuelve a
        intentarlo.
      </p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
