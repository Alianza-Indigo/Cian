<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · CIAN</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #faf8f5;
        --foreground: #1f1b16;
        --muted-foreground: #5c5349;
        --border: #e3dcd1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #16130f;
          --foreground: #f5f1ea;
          --muted-foreground: #b5aa9b;
          --border: #332c24;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--background);
        color: var(--foreground);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 1.5rem 0 0.5rem;
      }
      p {
        color: var(--muted-foreground);
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        color: inherit;
        text-decoration: none;
        min-height: 2.75rem;
      }
      a:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <!--
        El logotipo, como archivo y no dibujado aquí.

        Esta página se sirve desde la caché del service worker, así que el
        archivo tiene que estar precacheado también: si no, la única pantalla
        que se ve sin conexión aparecería sin marca. Ver PRECACHE_URLS en sw.js.
      -->
      <img
        src="/brand/cian-logo.png"
        alt="CIAN"
        width="128"
        height="90"
        style="height: 64px; width: auto"
      />
      <h1>Sin conexión</h1>
      <p>
        No pudimos conectar con CIAN. Revisa tu conexión a internet y vuelve a
        intentarlo.
      </p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
